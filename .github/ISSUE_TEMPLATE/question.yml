name: Question / Support
description: Ask a question or get help with usage
labels: ["question"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is this about?
      options:
        - giolt
        - giolt_sdk
        - glowvm
        - docs
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do? What have you already tried?
    validations:
      required: false
